    <h1> Ingrese los datos del paquete </h1>

    <br>
      <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-3 test_form">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="texto-formulario mb-0 text-center" >Formulario de Registro</h4>
            </div>
            <div class="card-body">
              <form>
                <div class="mb-3">
                  <label for="peso" class="form-label">Peso</label>
                  <input type="text" class="form-control" id="peso" placeholder="Por ejemplo: 5kg..." required>
                </div>

                
                <div class="mb-3">
                  <label for="volumen" class="form-label">Volumen</label>
                  <input type="text" class="form-control" id="volumen" placeholder="5³" required>
                </div>

                <div class="mb-3">
                  <label for="fecha" class="form-label">Fecha de ensamble</label>
                  <input type="date" class="form-control" id="fecha" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar</button>
              </form>
            </div>
          </div>
