    <h1> Ingrese los datos del empleado </h1>

    <br>
      <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-3 test_form">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="texto-formulario mb-0 text-center" >Formulario de Registro</h4>
            </div>
            <div class="card-body">
              <form>
                <div class="mb-3">
                  <label for="Nombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="Nombre" placeholder="" required>
                </div>

                
                <div class="mb-3">
                  <label for="Apellido" class="form-label">Apellido</label>
                  <input type="text" class="form-control" id="Apellido" placeholder="" required>
                </div>

                <div class="mb-3">
                  <label for="DNI" class="form-label">DNI</label>
                  <input type="number" class="form-control" id="DNI" placeholder="Ej. 44555666" required>
                </div>

                <div class="mb-3">
                  <label for="Email" class="form-label">Email</label>
                  <input type="text" class="form-control" id="Email" placeholder="" required>
                </div>

                
                <div class="mb-3">
                  <label for="Teléfono" class="form-label">Teléfono</label>
                  <input type="number" class="form-control" id="Teléfono" placeholder="Ej. 1112345678" required>
                </div>

                <div class="mb-3">
                  <label for="Sector" class="form-label">Sector</label>
                  <input type="text" class="form-control" id="Sector" placeholder="" required>
                </div>

                <div class="mb-3">
                  <label for="Cargo" class="form-label">Cargo</label>
                  <input type="text" class="form-control" id="Cargo" placeholder="" required>
                </div>
                <div class="mb-3">
                  <label for="Rol" class="form-label">Rol</label>
                  <input type="text" class="form-control" id="Rol" placeholder="" required>
                </div>                                


                <button type="submit" class="btn btn-primary w-100">Enviar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
