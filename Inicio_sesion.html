<!DOCTYPE html>
<html lang = "en">
<head>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
</head>
<body>
    <p style="text-align: right;" id="oooo"> No inicio sesion</p>
    <h1>Sistema de gestion de Clientes</h1>
    <p>Ingrese el nombre: </p>
    <input id="Nombre" type="text"  > 
    <p>Ingrese la contraseña: </p>
    <input id="contra" type="text"  >  
    <button onclick="cargar_datos()">Iniciar sesion</button>  
    <button onclick="cerrar_sesion()">Cerrar sesion</button>
    <script>
        var usuarios =JSON.parse(localStorage.getItem("lista"));
        var Usuario = JSON.parse(localStorage.getItem("Emm"));
        function cargar_datos(){
            let ids=document.getElementById("Nombre").value;
            let contras=document.getElementById("contra").value;
            let auxiliar = {
            Nombre: ids,
            Contrasenia: contras
            };
            localStorage.setItem("Emm", JSON.stringify(auxiliar));
            window.location.reload();

        }
        function cerrar_sesion(){
            Usuario.Nombre=null;
            Usuario.Contrasenia=null;
            localStorage.setItem("Emm", JSON.stringify(Usuario));
            window.location.reload();
        }
        if(Usuario.Nombre!=null){
            let total=usuarios.length;
            let contador=0;
            usuarios.forEach(element => {
                if(element.Nombre==Usuario.Nombre && element.Contrasenia==Usuario.Contrasenia){
                    document.getElementById("oooo").innerText=Usuario.Nombre;
                    contador=0;
                }
                contador++;
                
            });
            if (contador==total){
                document.getElementById("oooo").innerText="El usuario o/y la contrasenia son incorrectos";
            }
            
        }

    </script>
</body>
